when:
  - event: push
    branch: custom
  - event: manual
  - event: cron
    cron: "0 4 * * 1"

steps:
  build-custom:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: registry.kcolb.com/ludx/hermes-agent
      registry: registry.kcolb.com
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
      tags: custom
      dockerfile: Dockerfile.custom
      platforms:
        - linux/amd64
        - linux/arm64
    when:
      event: [push, manual, cron]

  notify-dockhand-rutherford:
    image: curlimages/curl:latest
    commands:
      - curl -X POST https://dockhand.kcolb.com/api/git/stacks/45/webhook
    when:
      event: [push, cron]
    depends_on:
      - build-custom

  notify-dockhand-dolores:
    image: curlimages/curl:latest
    commands:
      - curl -X POST https://dockhand.kcolb.com/api/git/stacks/47/webhook
    when:
      event: [push, cron]
    depends_on:
      - build-custom
